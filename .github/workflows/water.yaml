esphome:
  name: water-meter
  friendly_name: Счетчик воды

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:

ota:
  - platform: esphome

wifi:
  ssid: "MTS_FREE"
  password: "66668888"

# Полностью автономный локальный веб-интерфейс
web_server:
  port: 80
  version: 2
  local: true

# Смотрим реальное напряжение с датчика TCRT5000 на GPIO3
sensor:
  - platform: adc
    pin: GPIO3
    name: "Напряжение датчика"
    update_interval: 1s
    attenuation: 12db
