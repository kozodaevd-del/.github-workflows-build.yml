esphome:
  name: water-meter
  friendly_name: Счетчик воды

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

globals:
  - id: pulse_count
    type: int
    initial_value: '0'

binary_sensor:
  - platform: gpio
    name: "Пин GPIO0"
    pin: { number: GPIO0, mode: { input: true, pulldown: true } }
    on_press:
      then:
        - lambda: |-
            id(pulse_count) += 1;
            ESP_LOGI("COUNTER", "СРАБОТКА! Всего импульсов: %d", id(pulse_count));

  - platform: gpio
    name: "Пин GPIO1"
    pin: { number: GPIO1, mode: { input: true, pulldown: true } }
  - platform: gpio
    name: "Пин GPIO2"
    pin: { number: GPIO2, mode: { input: true, pulldown: true } }
  - platform: gpio
    name: "Пин GPIO3"
    pin: { number: GPIO3, mode: { input: true, pulldown: true } }
  - platform: gpio
    name: "Пин GPIO4"
    pin: { number: GPIO4, mode: { input: true, pulldown: true } }
  - platform: gpio
    name: "Пин GPIO5"
    pin: { number: GPIO5, mode: { input: true, pulldown: true } }
  - platform: gpio
    name: "Пин GPIO6"
    pin: { number: GPIO6, mode: { input: true, pulldown: true } }
  - platform: gpio
    name: "Пин GPIO7"
    pin: { number: GPIO7, mode: { input: true, pulldown: true } }
  - platform: gpio
    name: "Пин GPIO10"
    pin: { number: GPIO10, mode: { input: true, pulldown: true } }
