esphome:
  name: water-meter
  friendly_name: Счетчик воды

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

# Плата сама раздает Wi-Fi (не зависит от роутера и не зависает при поиске сети)
wifi:
  ap:
    ssid: "Water-Meter"
    password: "12345678"
  output_power: 8.5dB

web_server:
  port: 80
  version: 2
  local: true

globals:
  - id: total_liters
    type: float
    restore_value: yes
    initial_value: '0.0'

binary_sensor:
  - platform: gpio
    name: "Состояние датчика"
    pin:
      number: GPIO0
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      then:
        - lambda: |-
            id(total_liters) += 1.0;
            ESP_LOGI("COUNTER", "Литров: %.1f", id(total_liters));

sensor:
  - platform: template
    name: "Показания счетчика (м³)"
    unit_of_measurement: "м³"
    accuracy_decimals: 3
    update_interval: 1s
    lambda: |-
      return id(total_liters) / 1000.0;

  - platform: template
    name: "Всего литров"
    unit_of_measurement: "л"
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      return id(total_liters);

number:
  - platform: template
    name: "Установить показания (м³)"
    min_value: 0
    max_value: 99999
    step: 0.001
    unit_of_measurement: "м³"
    mode: box
    optimistic: true
    set_action:
      then:
        - lambda: |-
            id(total_liters) = x * 1000.0;
