esphome:
  name: water-meter
  friendly_name: Счетчик воды

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome

wifi:
  ssid: "MTS_FREE"
  password: "ВАШ_ПАРОЛЬ_ОТ_WIFI"
  output_power: 11dB

web_server:
  port: 80
  version: 2
  local: true

binary_sensor:
