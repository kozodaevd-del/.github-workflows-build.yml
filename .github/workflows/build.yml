name: Build ESPHome
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install esphome
      - run: esphome compile .github/workflows/water.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .github/workflows/.esphome/build/water-meter/.pioenvs/water-meter/firmware.factory.bin
